# Base stack. Dev: `make up` (auto-loads compose.override.yaml).
# Prod profile: `docker compose -f compose.yaml -f compose.prod.yaml up`.
name: ${COMPOSE_PROJECT_NAME:-delphin-crm}

x-backend-build: &backend-build
  context: ./backend
  target: runtime

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  EXPOSE_DOCS: ${EXPOSE_DOCS:-false}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-10485760}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env}
  FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST:-}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: waits for the DB, applies migrations, exits 0.
  migrate:
    build: *backend-build
    image: delphin-backend:local
    command: ["sh", "-c", "python scripts/wait_for_db.py && alembic upgrade head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    image: delphin-backend:local
    command:
      - gunicorn
      - app.main:create_app()
      - --worker-class=uvicorn.workers.UvicornWorker
      - --workers=${BACKEND_WORKERS:-2}
      - --bind=0.0.0.0:8000
      - --forwarded-allow-ips=*
      - --access-logfile=-
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?set VITE_FIREBASE_API_KEY in .env}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      # Dev: talk to the Auth Emulator through the Vite proxy (same origin as the app).
      VITE_FIREBASE_USE_EMULATOR: ${VITE_FIREBASE_USE_EMULATOR:-false}
      FIREBASE_EMULATOR_PROXY_TARGET: http://firebase:9099
      REQUIRE_PILOT: ${REQUIRE_PILOT:-false}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Playwright runner: `make e2e`. Baselines come read-only from the pilot.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.55.1-noble
    working_dir: /work
    environment:
      CI: "true"
      E2E_BASE_URL: http://frontend:5173
      PILOT_DIR: /reference/pilot
      REQUIRE_PILOT: ${REQUIRE_PILOT:-false}
      # Dev/test-only account created by `make e2e` (scripts/dev_create_user.py).
      E2E_EMAIL: ${E2E_EMAIL:-e2e@example.com}
      E2E_PASSWORD: ${E2E_PASSWORD:-e2e-password-not-secret}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_EMULATOR_URL: http://frontend:5173
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
    command: ["sh", "-c", "npm i -g pnpm@10.17.0 >/dev/null && pnpm install --frozen-lockfile && pnpm exec playwright test"]
    volumes:
      - ./frontend:/work
      - /work/node_modules
      - ./reference/pilot:/reference/pilot:ro
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  pgdata:
