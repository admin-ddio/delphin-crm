        if ((d.s === "verified" || d.s === "rejected") && !can("access.verify")) return toast("Only authorised team members may verify access.", true);
        a.status = d.s; a.verifiedBy = d.s === "verified" ? me.id : null;
        log(d.s === "verified" ? `Access verified (manual): ${a.label}` : `${a.label} access ${d.s.replace("_", " ")}`, c.id);
        return commit(d.s === "verified" ? "Access verified" : d.s === "rejected" ? "Access rejected — onboarding is blocked until it's fixed" : "Updated");
      }
      case "acc-all": c.access.forEach((a) => { if (["pending", "requested"].includes(a.status)) a.status = "received"; }); log("All platform access marked as received", c.id); return commit("All access marked received — now verify each item");
      case "kpi-confirm": {
        if (!can("kpi.confirm")) return toast("Only Account Managers record client confirmations.", true);
        const who = c.contact || "Client contact";
        c.kpis.forEach((k) => { if (!k.confirmedBy) k.confirmedBy = who; });
        log(`${who} confirmed the KPI targets via e-mail`, c.id); return commit("Client confirmation recorded");
      }
      case "kick": c[d.w] = d.s; log(`${d.w === "kickoffClient" ? "Client" : "Internal"} kickoff ${d.s === "done" ? "completed" : "scheduled"}`, c.id); return commit(d.s === "done" ? "Meeting completed" : "Meeting scheduled");
      case "team-add": { const v = document.getElementById("teamSel").value; if (!v) return; c.team.push(v); log(`${person(v).name} assigned to the client team`, c.id); return commit("Team member assigned"); }
      case "review": {
        const st = steps(c);
        const inc = st.list.slice(0, 10).filter((s) => s.st !== "done");
        if (inc.length) return toast(`Review can't pass yet. Incomplete: ${inc.map((s) => s.label).join(", ")}.`, true);
        c.reviewed = true; log("Onboarding review passed", c.id); return commit("Onboarding review passed");
      }
      case "complete": {
        const st = steps(c);
        if (st.byKey.ACCESS_OK.st !== "done") return toast("All required access items must be verified before onboarding can be completed.", true);
        if (st.byKey.KPI.st !== "done") return toast("KPI targets require client confirmation before onboarding can be completed.", true);
        const inc = st.list.slice(0, 11).filter((s) => s.st !== "done");
        if (inc.length) return toast(`Can't complete onboarding. Incomplete: ${inc.map((s) => s.label).join(", ")}.`, true);
        c.completed = true; c.completedAt = nowIso(); log("Onboarding completed — project creation enabled", c.id); return commit("Onboarding completed. The client is now Active.");
      }
      case "new-project": return createProject(d.id);
      case "new-task": drawer = { type: "newTask", projectId: d.id }; return renderOverlay();
      case "t-move": { const t = S.tasks.find((x) => x.id === drawer.id); return moveTask(t, d.s); }
      case "t-submit-ask": drawer.submit = true; return renderOverlay();
      case "t-submit-cancel": drawer.submit = false; return renderOverlay();
      case "t-assign": { const t = S.tasks.find((x) => x.id === drawer.id); t.assignee = document.getElementById("as_sel").value; log(`Task "${t.title}" assigned to ${person(t.assignee).name}`, t.clientId); return commit("Task reassigned"); }
      case "run-jobs": return runScheduler();
      case "inv-issue": { const i = S.invoices.find((x) => x.id === d.id); i.status = "issued"; log(`Invoice ${i.number} issued`, i.clientId); return commit("Invoice issued"); }
      case "inv-pay": {
        const i = S.invoices.find((x) => x.id === d.id);
        const amt = Number(document.getElementById("pay_" + i.id).value);
        if (!(amt > 0)) return toast("Enter the payment amount.", true);
        const bal = Math.round((i.total - i.paid) * 100) / 100;
        if (amt > bal + 0.001) return toast(`Payment exceeds the outstanding balance (${money(bal)}).`, true);
        i.paid = Math.round((i.paid + amt) * 100) / 100;
        i.status = i.paid >= i.total ? "paid" : "partial";
        log(`Payment of ${money(amt)} recorded on ${i.number}`, i.clientId); return commit("Payment recorded");
      }
    }
  });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target, fd = new FormData(f);
    if (f.id === "newClientForm") return createClient(fd);
    if (f.id === "kpiForm") {
      const c = findClient(f.dataset.id);
      if (!canManageOb(c)) return toast("Only the client's Account Manager can add KPI targets.", true);
      c.kpis.push({ id: uid("k"), metric: String(fd.get("metric")), baseline: String(fd.get("baseline")), target: String(fd.get("target")), unit: String(fd.get("unit")), confirmedBy: null });
      log(`KPI target defined: ${fd.get("metric")}`, c.id); return commit("KPI target added");
    }
    if (f.id === "submitForm") { const t = S.tasks.find((x) => x.id === drawer.id); return submitTask(t, String(fd.get("note") || ""), String(fd.get("link") || "")); }
    if (f.id === "decideForm") return decide(f.dataset.a, e.submitter ? e.submitter.value : "approved", String(fd.get("note") || ""), String(fd.get("who") || ""), String(fd.get("via") || ""));
    if (f.id === "newTaskForm") {
      const p = S.projects.find((x) => x.id === drawer.projectId);
      S.seq.task++;
      const t = { id: uid("t"), num: S.seq.task, projectId: p.id, clientId: p.clientId, title: String(fd.get("title")), assignee: String(fd.get("assignee")), reviewer: p.pm, status: "ready", requiresReview: !!fd.get("review"), requiresClient: !!fd.get("client"), due: String(fd.get("due") || ""), versions: [] };
      S.tasks.push(t); log(`Task "${t.title}" created and assigned to ${person(t.assignee).name}`, t.clientId);
      drawer = null; return commit("Task created");
    }
    if (f.id === "svcForm") {
      const cid = String(fd.get("client"));
      if (S.services.some((s) => s.clientId === cid)) return toast("This client already has an SEO retainer.", true);
      S.services.push({ id: uid("s"), clientId: cid, name: "SEO", amount: Number(fd.get("amount")) || 0, status: "active", start: today() });
      log("SEO retainer added", cid); return commit("Retainer added. Run the scheduler to generate this month's tasks.");
    }
    if (f.id === "invForm") {
      const amt = Number(fd.get("amount")), tax = Number(fd.get("tax")) || 0;
      if (!(amt > 0)) return toast("Enter an amount.", true);
      S.seq.invoice++;
      const total = Math.round(amt * (1 + tax / 100) * 100) / 100;
      const i = { id: uid("i"), number: `INV-${new Date().getFullYear()}-${pad(S.seq.invoice)}`, clientId: String(fd.get("client")), desc: String(fd.get("desc")), total, paid: 0, status: "draft", due: addDays(today(), 14) };
      S.invoices.push(i); log(`Invoice ${i.number} drafted (${money(total)})`, i.clientId); return commit("Draft invoice saved");
    }
  });

  function setPersona(id) {
    me = person(id);
    try { localStorage.setItem("dd.persona", id); } catch {}
    drawer = null;
    render();
    toast(`Now viewing as ${me.name} (${ROLE_LABEL[me.role]})`);
  }
  document.getElementById("personaSel").addEventListener("change", (e) => setPersona(e.target.value));
  document.getElementById("menuBtn").addEventListener("click", () => { navOpen = !navOpen; renderRail(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && drawer) { drawer = null; renderOverlay(); } });

  connect();
})();
</script>
