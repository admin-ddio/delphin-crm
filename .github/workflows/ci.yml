name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make secrets-scan

  checks:
    name: Lint → typecheck → test → build → e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Set to "true" once reference/pilot/ is committed: missing baselines then fail instead of skipping.
      REQUIRE_PILOT: ${{ vars.REQUIRE_PILOT || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env (CI-only throwaway secrets)
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^CRON_SECRET=.*/CRON_SECRET=$(openssl rand -hex 32)/" .env

      - name: Start stack
        run: make up

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Migration drift
        run: make migrate-check

      - name: Generated API client is current
        run: make gen-api-check

      - name: Build images (dev + prod)
        run: make build

      - name: E2E (smoke + visual parity)
        run: make e2e

      - name: Production profile serves SPA and /api through nginx
        run: |
          make down
          sed -i "s/^APP_ENV=.*/APP_ENV=production/" .env
          make prod-up
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/v1/auth/csrf -o /dev/null -w '%{http_code}\n' | grep -q 204
          make prod-down

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: make clean
